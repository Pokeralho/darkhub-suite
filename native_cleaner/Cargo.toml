[package]
name = "darkhub_cleaner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "DarkHub_Cleaner"
path = "src/main.rs"

[dependencies]
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
