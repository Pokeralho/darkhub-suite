[package]
name = "darkhub_cleaner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "DarkHub_Cleaner"
path = "src/main.rs"

[dependencies]
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
