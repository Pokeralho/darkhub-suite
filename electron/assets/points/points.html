<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
<title>DarkHub</title>
<link rel="stylesheet" href="points.css">
</head>
<body>
<canvas id="paths"></canvas>
<div id="pins"></div>
<div id="cursorHud" hidden><span id="coordText">0, 0</span></div>
<div id="bar">
  <span class="badge" id="counter">0 pontos</span>
  <span class="hint">Clique esquerdo marca ponto na ordem (#1, #2, #3...) · Clique direito desfaz · Enter conclui · Esc cancela</span>
  <div class="actions">
    <button type="button" id="undoBtn" disabled>Desfazer</button>
    <button type="button" id="cancelBtn">Cancelar (Esc)</button>
    <button type="button" id="doneBtn" class="primary" disabled>Concluir (Enter)</button>
  </div>
</div>
<script src="points.js"></script>
</body>
</html>
