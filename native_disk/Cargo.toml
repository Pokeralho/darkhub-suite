[package]
name = "darkhub_disk_rescue"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "DarkHub_DiskRescue"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
crc32fast = "1"
memchr = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_System_Registry"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
