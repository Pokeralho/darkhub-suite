<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' local-resource:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https: local-resource:; media-src 'self' blob: local-resource:; connect-src 'self' https: ws://localhost:5173; frame-src 'self' darkhub-ext:; object-src 'none'; base-uri 'self'; form-action 'none';">
    <title>DarkHub Suite</title>
    <!-- Geist + Geist Mono are bundled locally via @fontsource (see src/main.tsx) so the UI renders offline. -->
    <style>
      html,
      body,
      #app {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #0b0d10;
        color: #eef0f3;
      }

      body {
        font-family: 'Geist Variable', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
        font-feature-settings: "ss01";
      }

      .boot-fallback {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #0b0d10;
      }

      .boot-titlebar {
        height: 32px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        background: #0b0d10;
        border-bottom: 1px solid #24282d;
        box-sizing: border-box;
      }

      .boot-brand {
        width: 120px;
        height: 12px;
        border-radius: 4px;
        background: #24282d;
      }

      .boot-body {
        flex: 1;
        display: grid;
        grid-template-columns: 232px 1fr;
        min-height: 0;
      }

      .boot-sidebar {
        padding: 8px;
        border-right: 1px solid #24282d;
        background: #0b0d10;
        box-sizing: border-box;
      }

      .boot-nav {
        height: 28px;
        margin-bottom: 4px;
        border-radius: 6px;
        background: #16191d;
      }

      .boot-nav:nth-child(n+4) {
        background: #111317;
      }

      .boot-content {
        padding: 20px;
        background: #0d0f12;
        box-sizing: border-box;
      }

      .boot-heading {
        width: min(360px, 45vw);
        height: 34px;
        margin-bottom: 24px;
        border-radius: 8px;
        background: #16191d;
      }

      .boot-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        max-width: 920px;
      }

      .boot-panel {
        height: 132px;
        border: 1px solid #24282d;
        border-radius: 8px;
        background: #111317;
      }

      @media (max-width: 760px) {
        .boot-body {
          grid-template-columns: 72px 1fr;
        }

        .boot-sidebar {
          padding: 18px 12px;
        }

        .boot-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body class="bg-dark-bg text-gray-100">
    <div id="app">
      <div class="boot-fallback" aria-hidden="true">
        <div class="boot-titlebar"><div class="boot-brand"></div></div>
        <div class="boot-body">
          <aside class="boot-sidebar">
            <div class="boot-nav"></div>
            <div class="boot-nav"></div>
            <div class="boot-nav"></div>
            <div class="boot-nav"></div>
            <div class="boot-nav"></div>
            <div class="boot-nav"></div>
          </aside>
          <main class="boot-content">
            <div class="boot-heading"></div>
            <div class="boot-grid">
              <div class="boot-panel"></div>
              <div class="boot-panel"></div>
              <div class="boot-panel"></div>
            </div>
          </main>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
